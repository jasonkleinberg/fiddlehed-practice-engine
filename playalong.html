<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FiddleHed Practice Engine — 3-Layer Play-Along</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

       be answered after the fact.

       LIVE since 2026-08-24. Property "Practice Engine" (551469307),
       stream "Practice Engine (web)" (15495626590), under the FiddleHed
       account (100206817). Reporting timezone: Detroit.

       Deliberately a SEPARATE property from MetroDrone (521299059) --

       The guard below means that if PE_GA_ID is ever blanked or reset to

       ================================================================= -->
  <script>
    window.PE_GA_ID = "G-EX40FLVXGH";   // Practice Engine property 551469307
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    (function () {
      var id = window.PE_GA_ID;
      var live = /^G-[A-Z0-9]{6,}$/.test(id) && id !== "G-XXXXXXXXXX";
      if (!live) {
        console.warn("[pe-analytics] OFF — PE_GA_ID is still the placeholder. " +
                     "Set it in playalong.html to start collecting.");
        return;
      }
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
      document.head.appendChild(s);
      gtag("js", new Date());
      gtag("config", id);
    })();
  </script>
  <style>
    /* ==========================================================
       Practice Engine — FiddleHed brand skin ("Poster" direction)
       Obsolete headings + Karla body · red #990034 on cream #FBF6EC
       Sibling of the MetroDrone skin (metrodrone/index.html).
       Style source: fiddlehed-content/Knowledge/brand-style.md
       Reskin only (v1.13): no control/behavior changes.
       ========================================================== */
    @import url('https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,700;1,400&display=swap');

    @font-face {
      font-family: 'Obsolete';
      src: url('Obsolete.woff2') format('woff2'),
           url('Obsolete.woff') format('woff');
      font-display: swap;
    }

    :root {
      --fh-red: #990034;
      --fh-red-dark: #7a0029;
      --fh-cream: #FBF6EC;
      --fh-ink: #1d1a16;
      --fh-gray: #666666;
      --fh-line: #d8cfbe;
      --fh-pink: #e8b7c6;
      --fh-paper: #fffdf7;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Karla', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #efe7d8;
      color: var(--fh-gray);
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }

    .card {
      background: var(--fh-cream);
      border-radius: 8px;
      box-shadow: 0 8px 26px rgba(29, 26, 22, 0.18);
      overflow: hidden;
    }

    /* ---- Masthead ---- */
    .band {
      background: var(--fh-red);
      padding: 20px 28px 16px;
      text-align: center;
    }

    .band h1 {
      font-family: 'Obsolete', Georgia, serif;
      font-weight: normal;
      color: var(--fh-cream);
      font-size: 2.5rem;
      line-height: 1;
      margin: 0;
    }

    .band-tag {
      color: var(--fh-pink);
      font-size: 0.72rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 7px;
    }

    .app-body { padding: 20px 28px 0; }

    .tune-title {
      font-family: 'Obsolete', Georgia, serif;
      color: var(--fh-red);
      font-size: 1.5rem;
      text-align: center;
      margin: 0 0 2px;
    }

    .lesson-line { text-align: center; margin: 0 0 14px; min-height: 1.2em; }
    .lesson-link { font-size: 0.9rem; color: var(--fh-red); }
    a { color: var(--fh-red); }

    /* ---- Tune picker ---- */
    .picker { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
    .picker input[type="text"] {
      flex: 1 1 12rem; padding: 0.5rem 0.7rem; font-size: 0.95rem;
      font-family: 'Karla', sans-serif; color: var(--fh-ink);
      border: 1.5px solid var(--fh-ink); border-radius: 6px; background: var(--fh-paper);
    }
    .picker select {
      flex: 2 1 16rem; padding: 0.5rem; font-size: 0.95rem; max-width: 100%;
      font-family: 'Karla', sans-serif; color: var(--fh-ink);
      border: 1.5px solid var(--fh-ink); border-radius: 6px; background: var(--fh-paper);
    }
    .picker input[type="text"]:focus, .picker select:focus {
      outline: none; border-color: var(--fh-red);
      box-shadow: 0 0 0 2px rgba(153, 0, 52, 0.15);
    }

    /* ---- Transport ---- */
    /* v1.19: sticky — the iframe is short (400px default), so the transport
       must survive scrolling into the score. Background covers what slides under. */
    .controls {
      margin: 1.2rem 0; display: flex; gap: 0.6rem; flex-wrap: wrap;
      position: sticky; top: 0; z-index: 30;
      background: var(--fh-cream);
      padding: 0.5rem 0;
      box-shadow: 0 6px 8px -8px rgba(0,0,0,0.35);
    }
    .controls button {
      flex: 1 1 6rem;
      padding: 0.65rem 1rem; font-size: 1.1rem; cursor: pointer;
      font-family: 'Obsolete', Georgia, serif; font-weight: normal;
      text-transform: uppercase; letter-spacing: 3px;
      border-radius: 6px; transition: all 0.15s ease;
      background: transparent; color: var(--fh-ink);
      border: 1.5px solid var(--fh-ink);
    }
    .controls button#play {
      background: var(--fh-ink); color: var(--fh-cream);
    }
    .controls button#play:hover:not(:disabled) {
      background: var(--fh-red); border-color: var(--fh-red);
    }
    .controls button:hover:not(:disabled) { color: var(--fh-red); border-color: var(--fh-red); }
    .controls button#play:hover:not(:disabled) { color: var(--fh-cream); }
    .controls button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { cursor: not-allowed; opacity: 0.4; }

    /* ---- Loop section buttons ---- */
    .sections { margin: 0.75rem 0; display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .sections .sections-label {
      font-size: 0.72rem; color: var(--fh-ink); font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.5px; margin-right: 0.25rem;
    }
    .sections button {
      padding: 0.3rem 0.7rem; font-size: 0.9rem; cursor: pointer;
      font-family: 'Karla', sans-serif; font-weight: 700;
      border: 1.5px solid var(--fh-ink); border-radius: 6px;
      background: var(--fh-paper); color: var(--fh-ink);
      transition: all 0.15s ease;
    }
    .sections button:hover { border-color: var(--fh-red); color: var(--fh-red); }
    .sections button.active {
      background: var(--fh-red); border-color: var(--fh-red); color: var(--fh-cream);
    }

    /* ---- Sliders ---- */
    .slider { margin: 1rem 0; }
    .slider label {
      display: block; margin-bottom: 0.25rem;
      font-size: 0.72rem; font-weight: 700; color: var(--fh-ink);
      text-transform: uppercase; letter-spacing: 1.5px;
    }
    .slider label span { color: var(--fh-red); }
    input[type="range"] {
      width: 100%; height: 4px; border-radius: 2px;
      background: var(--fh-line); outline: none;
      -webkit-appearance: none; appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--fh-red); border: 2px solid var(--fh-cream);
      box-shadow: 0 1px 4px rgba(29, 26, 22, 0.35);
      cursor: pointer; transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
    input[type="range"]::-moz-range-thumb {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--fh-red); border: 2px solid var(--fh-cream);
      box-shadow: 0 1px 4px rgba(29, 26, 22, 0.35);
      cursor: pointer; transition: transform 0.15s ease;
    }
    input[type="range"]::-moz-range-thumb:hover { transform: scale(1.15); }

    /* ---- Layer mixer ---- */
    .layers {
      border: 1px solid var(--fh-line);
      border-radius: 6px;
      padding: 0.5rem 1rem 1rem;
      margin-top: 1.5rem;
      background: var(--fh-paper);
    }
    /* One line per layer: track name left, volume % right (v1.15) */
    .layers .slider label {
      display: flex; justify-content: space-between; align-items: baseline;
      text-transform: none; letter-spacing: 0;
    }
    .layers .track-name {
      font-family: 'Obsolete', Georgia, serif; font-weight: normal;
      font-size: 1rem; color: var(--fh-red); letter-spacing: 1px;
    }
    .layers .slider label span:last-child { color: var(--fh-red); font-weight: 700; }

    .status { margin-top: 1rem; color: var(--fh-gray); font-size: 0.9rem; font-style: italic; min-height: 1.2em; }
    .hint { color: #a89f8d; font-size: 0.8rem; }

    /* ---- Sheet music (OSMD) ---- */
    .score-wrap {
      border: 1px solid var(--fh-line);
      border-radius: 6px;
      margin-top: 1.5rem;
      padding: 0.5rem 0.75rem 1rem;
      background: #fff;   /* notation stays on white for readability */
      overflow-x: auto;   /* narrow screens: score scrolls sideways, not the page */
    }
    .score-wrap .score-hint {
      color: #a89f8d; font-size: 0.8rem; margin: 0.25rem 0 0;
    }
    /* Hide-sheet-music toggle (memorization practice, v1.12) */
    .score-toggle {
      padding: 0.3rem 0.7rem; font-size: 0.9rem; cursor: pointer;
      font-family: 'Karla', sans-serif; font-weight: 700;
      border: 1.5px solid var(--fh-ink); border-radius: 6px;
      background: var(--fh-paper); color: var(--fh-ink);
      margin-bottom: 0.25rem; transition: all 0.15s ease;
    }
    .score-toggle:hover { border-color: var(--fh-red); color: var(--fh-red); }
    .score-toggle.active {
      background: var(--fh-red); border-color: var(--fh-red); color: var(--fh-cream);
    }
    .score-wrap.score-hidden #score,
    .score-wrap.score-hidden .score-hint { display: none; }
    .score-wrap.score-hidden .memorize-hint { display: block; }
    .memorize-hint {
      display: none; color: var(--fh-gray); font-size: 0.9rem;
      font-style: italic; margin: 0.5rem 0 0.25rem;
    }
    #score { min-height: 120px; }
    #score svg { display: block; }
    /* Notes are clickable (click-to-seek) */
    .pe-note-click { cursor: pointer; }
    /* The sounding note: FiddleHed red. CSS beats VexFlow's presentation
       attributes, and removing the class reverts cleanly. */
    .pe-active, .pe-active * {
      fill: #990034 !important;
      stroke: #990034 !important;
    }
    /* Gray band behind the bars of the active loop section */
    .pe-section-shade {
      fill: #888;
      opacity: 0.13;
      pointer-events: none;   /* clicks pass through to the notes */
    }

    /* ---- Art footer ---- */
    .art {
      margin-top: 1.5rem;
      border-top: 1px solid var(--fh-line);
      text-align: center;
      padding-top: 0.5rem;
    }
    .art img {
      display: block;
      width: min(420px, 80%);
      height: auto;
      margin: 0 auto;
      mix-blend-mode: multiply;
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      .app-body { padding: 16px 20px 0; }
      .band h1 { font-size: 2rem; }
      .controls button { font-size: 1rem; padding: 0.55rem 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="band">
      <h1>Practice Engine</h1>
      <div class="band-tag">FiddleHed &middot; Practice Tools</div>
    </div>
    <div class="app-body">
      <p class="tune-title" id="tune-title">Loading tune&hellip;</p>
      <p class="lesson-line"><a class="lesson-link" id="lesson-link" href="#" target="_blank" rel="noopener" style="display:none">Watch the lesson &rarr;</a></p>

      <div class="picker">
        <input type="text" id="tune-search" placeholder="Search tunes…" aria-label="Search tunes" />
        <select id="tune-select" aria-label="Choose a tune"></select>
      </div>

      <div class="controls">
        <button id="play" disabled>Play</button>
        <button id="pause" disabled>Pause</button>
        <button id="stop" disabled>Stop</button>
      </div>

      <div class="sections" id="sections"></div>

      <div class="slider tempo">
        <label for="tempo">Tempo: <span id="tempo-readout">80 BPM</span></label>
        <input type="range" id="tempo" min="40" max="200" value="80" step="1" />
      </div>

      <div class="layers">
        <div class="slider">
          <label for="melody-volume"><span class="track-name">Melody (violin)</span><span id="melody-volume-readout">30%</span></label>
          <input type="range" id="melody-volume" min="0" max="100" value="30" step="1" />
        </div>

        <div class="slider">
          <label for="organ-volume"><span class="track-name">Organ (chords)</span><span id="organ-volume-readout">30%</span></label>
          <input type="range" id="organ-volume" min="0" max="100" value="30" step="1" />
        </div>

        <div class="slider">
          <label for="kick-volume"><span class="track-name">Kick (beat)</span><span id="kick-volume-readout">30%</span></label>
          <input type="range" id="kick-volume" min="0" max="100" value="30" step="1" />
        </div>
      </div>

      <div class="score-wrap" id="score-wrap">
        <button class="score-toggle" id="score-toggle" type="button" aria-pressed="false">Hide sheet music</button>
        <p class="memorize-hint">Playing from memory. You've got this.</p>
        <div id="score" aria-label="Sheet music"></div>
        <p class="score-hint">Click any note to jump there.</p>
      </div>


      <p class="status" id="status">Initializing&hellip;</p>
      <p class="hint">Spacebar toggles play/pause. Three layers, one Tone.js clock. <span id="version"></span></p>

      <div class="art"><img src="fiddler.png" alt="Pen-and-ink drawing of a seated fiddler" /></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.0/build/opensheetmusicdisplay.min.js"></script>
  <!-- Bump ?v= together with APP_VERSION so browsers fetch the new JS. -->
  <script src="js/playalong.js?v=1.21"></script>
</body>
</html>
